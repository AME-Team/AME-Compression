<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AME Compression</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      フォントは ame-ui-typography 規約に従い Google Fonts (Noto Sans/Serif JP, Noto Sans Mono) から配信する。
      Electron オフライン時は --font-ui-* のフォールバックスタック（システム sans-serif）に
      自動でフォールバックするため表示は破綻しない（進行性拡張）。
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600;700&family=Noto+Serif:wght@500;600;700&family=Noto+Sans+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        // 保存済みテーマ/アクセントを初回描画前に適用して FOUC を防ぐ。
        // useTheme() / useAccentColor() が設定を変更するたびに localStorage へ書く。
        var themeMode = null
        var accent = null
        try {
          themeMode = localStorage.getItem('ame-theme-mode')
          accent = localStorage.getItem('ame-accent-color')
        } catch (e) {
          /* ignore */
        }
        var root = document.documentElement
        var resolved
        if (themeMode === 'light' || themeMode === 'dark') {
          resolved = themeMode
        } else {
          try {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (e) {
            resolved = 'light'
          }
        }
        // アクセントの許可集合は useTheme.ts (ACCENT_COLORS) が唯一の真実源。
        // 未知の data-accent 値は CSS の :root デフォルト (trust-blue) へフォールバックするため、
        // ここでは許可リストを複製しない。
        root.setAttribute('data-theme', resolved)
        root.setAttribute('data-accent', accent || 'trust-blue')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
