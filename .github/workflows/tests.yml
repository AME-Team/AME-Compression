# =============================================================================
# Tests — pytest + dependency audits
# =============================================================================
# Static analysis lives in `lint.yml` (single source of truth: pre-commit).
# This workflow focuses on test execution and supply-chain checks that are
# too slow or too runtime-specific to belong in pre-commit.
# =============================================================================

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # pytest — backend unit/integration tests on every supported platform
  # ---------------------------------------------------------------------------
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests -v --tb=short

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.os }}
          path: |
            .pytest_cache/
            coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # pip-audit — scan installed Python packages for known CVEs
  # ---------------------------------------------------------------------------
  pip-audit:
    name: pip-audit (Python supply chain)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pip-audit
        run: |
          uv pip install pip-audit
          uv run pip-audit --strict --desc on
