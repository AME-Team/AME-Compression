# =============================================================================
# Update pre-commit hooks — monthly automated PR
# =============================================================================
# Runs `pre-commit autoupdate` on the first of every month and opens a PR
# with the bumped hook revisions. This keeps the toolchain current without
# manual toil. The PR triggers the `lint.yml` workflow, so any update that
# breaks a rule is caught before merge.
# =============================================================================

name: Update pre-commit hooks

on:
  schedule:
    # At 09:00 JST (00:00 UTC) on the 1st of every month
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    name: pre-commit autoupdate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate token
        id: token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.AUTOUPDATE_APP_ID }}
          private_key: ${{ secrets.AUTOUPDATE_APP_PRIVATE_KEY }}
        # Falls back to GITHUB_TOKEN if the GitHub App secret is not configured
        continue-on-error: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pre-commit
        run: uv pip install pre-commit

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create / reset update branch
        run: |
          git checkout -B chore/update-pre-commit-hooks origin/main || \
            git checkout -B chore/update-pre-commit-hooks

      - name: Run pre-commit autoupdate
        run: uv run pre-commit autoupdate

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet .pre-commit-config.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add .pre-commit-config.yaml
          git commit -m "chore(ci): bump pre-commit hook revisions

          Generated by \`Update pre-commit hooks\` workflow.
          Source-of-truth: .pre-commit-config.yaml"
          git push --force-with-lease origin chore/update-pre-commit-hooks

      - name: Create / update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          PR_BODY=$(cat <<'EOF'
          ## Automated pre-commit hook update

          This PR bumps the pinned `rev:` versions in `.pre-commit-config.yaml`
          to their latest tags. The `lint.yml` workflow will validate every
          hook at the new revisions before this PR can merge.

          **Reviewer checklist:**
          - [ ] `lint.yml` is green
          - [ ] No new false positives in the diff
          - [ ] No removal of project-specific rules

          ---
          Generated by the `Update pre-commit hooks` scheduled workflow.
          EOF
          )
          gh pr create \
            --base main \
            --head chore/update-pre-commit-hooks \
            --title "chore(ci): bump pre-commit hook revisions" \
            --label dependencies,ci \
            --body "$PR_BODY" \
            || gh pr edit \
              --base main \
              --head chore/update-pre-commit-hooks \
              --body "$PR_BODY"
