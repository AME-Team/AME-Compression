# =============================================================================
# Build Executable — produce distributable Electron + Python bundle
# =============================================================================
# Static analysis is delegated to `lint.yml`. This workflow builds the
# distributable artifacts on Windows (the primary target platform) and
# performs a single safety check on the produced binary. Triggers:
#   - version tags (`v*`)
#   - manual dispatch
# =============================================================================

name: Build Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Pre-flight — refuse to build from a non-green baseline
  # ---------------------------------------------------------------------------
  gate:
    name: Require green lint on the tagged commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm lint workflow is passing for this ref
        uses: actions/github-script@v9
        with:
          script: |
            const lintWorkflow = "lint.yml";
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: lintWorkflow,
              head_sha: context.sha,
              per_page: 5,
            });
            const success = runs.data.workflow_runs.some(
              (r) => r.conclusion === "success",
            );
            if (!success) {
              core.setFailed(
                `Refusing to build: no successful '${lintWorkflow}' run for commit ${context.sha}.`,
              );
            }

  # ---------------------------------------------------------------------------
  # Build (directory mode) — produces a portable folder
  # ---------------------------------------------------------------------------
  build:
    name: Build (directory mode)
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root tooling dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build executable (directory mode)
        run: uv run python scripts/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AME-Compression-windows
          path: dist/AME-Compression/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Build (onefile mode) — produces a single self-extracting .exe
  # ---------------------------------------------------------------------------
  build-onefile:
    name: Build (onefile mode)
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root tooling dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build executable (single file)
        run: uv run python scripts/build.py --onefile

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AME-Compression-onefile
          path: dist/AME-Compression.exe
          retention-days: 30
